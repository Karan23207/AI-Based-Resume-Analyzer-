<!DOCTYPE html>
<html>
<head>

    <title>History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="container mt-5">

<h1>Your Resume History</h1>

<table class="table table-bordered mt-4">

    <tr>

        <th>ATS Score</th>
        <th>Skills</th>
        <th>Rank</th>
        <th>Date</th>

    </tr>

    {% for row in data %}

    <tr>

        <td>{{ row[0] }}%</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>

    </tr>

    {% endfor %}

</table>

<a href="/dashboard" class="btn btn-primary">
    Back To Dashboard
</a>

</body>
</html>
