<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='dashboard.css') }}">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2 class="logo">ResumeAI</h2>

    <a href="/dashboard">Dashboard</a>
    <a href="#upload-section" class="sidebar-link">Analyze Resume</a>
    <a href="/history">History</a>

    <a href="/logout" class="logout-btn">Logout</a>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- TOP BAR -->
    <div class="topbar">
        <h2>Welcome Back ,{{username}}👋</h2>
    </div>

    <!-- CARDS -->
    <div class="row g-4">

        <div class="col-md-4">
            <div class="dashboard-card">
                <h4>ATS Score</h4>
                <p class="score">{{ ats_score }}%</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <h4>Skills Matched</h4>
                <p class="score">{{ skills_count }}</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <h4>Resume Rank</h4>
                <p class="score">{{ resume_rank }}</p>
            </div>
        </div>

    </div>

    <!-- UPLOAD SECTION -->
    <div class="upload-box mt-5 " id="upload-section">

        <h3>Upload Your Resume</h3>

        <form action="/upload" method="POST" enctype="multipart/form-data">

    <input type="file"
           name="resume"
           class="form-control mb-3"
           required>

    <button class="btn btn-primary" onclick="showLoading()">
    Analyze Resume
</button>

</form>
        <script>

function showLoading(){

    alert("Analyzing Resume...");

}

</script>
    </div>

</div>

</body>
</html>
